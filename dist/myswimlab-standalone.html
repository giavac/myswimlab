<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySwimLab v0.1.0</title>
  <style>
/*
 * MySwimLab: instrument-console theme.
 * Light "lab notebook" by default; dark console when the system prefers dark.
 * All colors are tokens. System fonts only: the app makes no external requests.
 */
:root {
  color-scheme: light dark;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg: #f3f5f1;
  --bg-grid: #e6ebe8;
  --panel: #fbfcf9;
  --field: #ffffff;
  --line: #d3dce0;
  --line-strong: #b3c3cc;
  --line-soft: #e1e7ea;
  --ink: #13283a;
  --ink-2: #3f566a;
  --ink-3: #55697b;
  --accent: #0b7d84;
  --accent-ink: #ffffff;
  --accent-soft: rgba(11, 125, 132, .08);
  --accent-line: rgba(11, 125, 132, .45);
  --warn: #8a5a00;
  --warn-soft: rgba(196, 132, 0, .08);
  --warn-line: rgba(138, 90, 0, .45);
  --danger: #a3322e;
  --focus: #0b7d84;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a141d;
    --bg-grid: #0f1f2c;
    --panel: #0e1c28;
    --field: #0a141d;
    --line: #1e3444;
    --line-strong: #2a4a5c;
    --line-soft: #1a2f3e;
    --ink: #dbe7ef;
    --ink-2: #93aabb;
    --ink-3: #7891a5;
    --accent: #3fd0c9;
    --accent-ink: #0a141d;
    --accent-soft: rgba(63, 208, 201, .10);
    --accent-line: rgba(63, 208, 201, .45);
    --warn: #f2b134;
    --warn-soft: rgba(242, 177, 52, .07);
    --warn-line: rgba(242, 177, 52, .45);
    --danger: #ff8a80;
    --focus: #3fd0c9;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  font-synthesis: none;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
a { color: var(--accent); }

h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 32px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 6px; }
h2 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
h3 { font-size: 14px; font-weight: 500; }
p { line-height: 1.55; }

/* Shared instrument typography */
.eyebrow, .breadcrumb, .fig, .metric-top, th, .tag, .navitem, .periods button,
.statusline, .primary, .secondary, .subtle, .danger-lite, .quality-action, .quality-jump,
.fieldlabel, .panel-label, footer, .privacy, .privacy-sub, .asidelink {
  font-family: var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.metric strong, td, .bests strong, .bests small, .statusline, .fineprint, .rule {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.warn { color: var(--warn) !important; }
.muted { color: var(--ink-3); font-size: 13px; }

/* Frame */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 236px;
  min-width: 236px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.logo {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 24px 20px;
  font-weight: 600;
  font-size: 17px;
  letter-spacing: .02em;
}
.mark { color: var(--accent); display: flex; }
.nav { padding: 8px 14px; display: grid; gap: 4px; }
.navitem {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  font-size: 12px;
}
.navitem:hover { border-color: var(--line-strong); }
.navitem.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.navnum { color: var(--ink-3); }
.navitem.active .navnum { color: var(--accent); }
.navnum::after { content: " ·"; }
.asidefoot { margin: auto 20px 24px; font-size: 11px; line-height: 1.7; }
.asidefoot p { font-size: 12px; color: var(--ink-3); margin: 10px 0 12px; line-height: 1.5; }
.privacy { color: var(--accent); font-size: 11px; }
.privacy-sub { color: var(--ink-3); font-size: 11px; }
.asidelink { border: 0; color: var(--accent); background: none; font-size: 11px; padding: 0; text-align: left; }

.workspace { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.topbar {
  min-height: 64px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 12px 32px;
  gap: 12px;
}
.periods { display: flex; border: 1px solid var(--line-strong); }
.periods button {
  min-height: 36px;
  border: 0;
  border-right: 1px solid var(--line-strong);
  background: none;
  color: var(--ink-2);
  padding: 0 14px;
  font-size: 12px;
}
.periods button:last-child { border-right: 0; }
.periods button.chosen { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.statusline {
  flex: 1 1 200px;
  min-width: 0;
  color: var(--ink-2);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.statusline .dot { color: var(--accent); }
.topactions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mobilelogo { display: none; }

main { padding: 32px; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; }
footer {
  padding: 20px 32px 28px;
  color: var(--ink-3);
  font-size: 11px;
}
footer a { color: var(--accent); }

/* Buttons */
.primary {
  min-height: 40px;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 0 16px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary:hover { filter: brightness(1.08); }
.secondary {
  min-height: 40px;
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--ink);
  padding: 0 14px;
  font-size: 12px;
}
.secondary:hover { border-color: var(--accent); color: var(--accent); }
.subtle { border: 0; background: none; color: var(--accent); font-size: 12px; white-space: nowrap; padding: 6px 0; }
.subtle:hover { text-decoration: underline; }
.danger-lite {
  min-height: 40px;
  border: 1px solid var(--danger);
  background: transparent;
  color: var(--danger);
  padding: 0 12px;
  font-size: 12px;
}

/* Page head */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
.pagehead p { color: var(--ink-2); font-size: 14px; margin: 0 0 8px; }
.eyebrow, .breadcrumb { font-size: 11px; letter-spacing: .2em; color: var(--ink-3); margin-bottom: 6px; }
.pageactions { display: flex; align-items: center; gap: 10px; }

/* Panels with corner brackets */
.metric, .panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
}
.metric::before, .metric::after, .panel::before, .panel::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border-color: var(--accent);
  border-style: solid;
  opacity: .8;
  pointer-events: none;
}
.metric::before, .panel::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.metric::after, .panel::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.metrics.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.metric-top { font-size: 11px; letter-spacing: .16em; color: var(--ink-3); }
.metric strong { font-size: 30px; font-weight: 400; color: var(--ink); }
.metric strong small { font-size: 13px; color: var(--ink-2); }
.metric p { font-size: 11px; color: var(--ink-2); margin: 0; font-family: var(--mono); }

.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.twocol.unequal { grid-template-columns: 1.4fr 1fr; }
.panel { padding: 20px; margin-bottom: 16px; min-width: 0; }
.twocol .panel { margin-bottom: 0; }
.panelhead { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
.panelhead h2 { margin: 0; }
.panelhead p { color: var(--ink-3); font-size: 12px; margin: 4px 0 0; }
.fig { font-size: 11px; letter-spacing: .14em; color: var(--ink-3); white-space: nowrap; text-align: right; }
.panel-label { display: block; font-size: 11px; letter-spacing: .16em; font-weight: 500; margin-bottom: 8px; }

/* Charts */
.plot { width: 100%; height: 225px; display: block; overflow: visible; }
.chart-grid { stroke: var(--line-soft); stroke-width: 1; }
.chart-axis { stroke: var(--line-strong); stroke-width: 1; }
.chart-text { fill: var(--ink-3); font-family: var(--mono); }
.chart-point { fill: var(--panel); stroke-width: 1.4; }
.chart-band { fill: var(--warn); fill-opacity: .08; }
.chart-band-text { fill: var(--warn); font-family: var(--mono); letter-spacing: .1em; }
.empty-chart { height: 210px; display: grid; place-items: center; color: var(--ink-3); font-size: 13px; font-family: var(--mono); }

.bars { height: 225px; display: flex; align-items: stretch; gap: 16px; padding: 10px 6px 4px; }
.barcol { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 8px; text-align: center; }
.bar-track {
  flex: 1;
  min-height: 0;
  border-bottom: 1px solid var(--line-strong);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: repeating-linear-gradient(to top, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent 40px);
}
.bar-fill { width: min(64%, 48px); background: var(--accent); opacity: .85; }
.barcol small { font-size: 11px; color: var(--ink-3); white-space: nowrap; font-family: var(--mono); }

/* Best efforts */
.effort-group + .effort-group { margin-top: 20px; }
.effort-group h3 { margin: 10px 0; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.bests {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.besttile { background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 92px; }
.besttile > span { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.bests strong { font-size: 24px; font-weight: 400; }
.bests small { font-size: 11px; color: var(--ink-2); }
.best-pace { color: var(--ink-2); }
.besttile.new > span, .besttile.new strong { color: var(--warn); }

/* Insight and next step */
.insight-body { font-size: 14px; line-height: 1.65; color: var(--ink-2); }
.insight-body b { font-size: 15px; font-weight: 500; color: var(--ink); }
.insight-body p { margin: 10px 0; }
.insight-body p.muted { font-size: 12px; }
.insight-link { margin-top: 8px; }
.feature-session { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 8px 0 18px; }
.feature-session h3 { font-size: 20px; margin: 4px 0 8px; }
.feature-session p { font-size: 13px; color: var(--ink-2); margin: 0; font-family: var(--mono); }
.feature-session .primary { white-space: nowrap; }
.feature-foot { border-top: 1px solid var(--line); padding-top: 14px; color: var(--ink-3); font-size: 12px; line-height: 1.6; }

/* Tables */
.tablewrap { width: 100%; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; text-align: left; }
th {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--ink-3);
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-strong);
}
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); color: var(--ink); }
td.strong { font-family: var(--sans); }
tbody tr[data-select] { cursor: pointer; }
tbody tr[data-select]:hover { background: var(--accent-soft); }
.arrow { font-size: 20px; color: var(--accent); }
.session-link {
  display: inline;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  padding: 2px 0;
  text-align: left;
}
.session-link:hover { text-decoration: underline; }
.pb-mark {
  margin-left: 6px;
  padding: 1px 5px;
  border: 1px solid var(--warn);
  color: var(--warn);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
}

.tag {
  display: inline-block;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
  font-size: 11px;
  padding: 4px 8px;
}
.tag.real { color: var(--accent); border-color: var(--accent-line); }
.tag.pb { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }

/* Length quality */
.length-scroll { max-height: 420px; overflow: auto; }
.excluded-length { background: var(--warn-soft); }
.excluded-length td { color: var(--warn); }
.quality-status { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.quality-action, .quality-jump {
  min-height: 32px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--ink-2);
  font-size: 11px;
  padding: 0 10px;
  margin: 2px 2px 2px 0;
}
.quality-action:hover, .quality-jump:hover { border-color: var(--accent); color: var(--accent); }
.excluded-length .quality-action { border-color: var(--warn); color: var(--warn); }
.quality-panel .panel-label { color: var(--warn); }
.quality-panel p, .pb-panel p { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.rule { font-size: 12px !important; }
.pb-panel { background: var(--warn-soft); border-color: var(--warn-line); }
.pb-panel .panel-label, .pb-dist { color: var(--warn); }

.info { color: var(--ink); }
.info p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; }
.interval-summary { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
.interval-row.set-start td { border-top: 1px solid var(--line-strong); }
.set-name { color: var(--accent); font-weight: 500; }
.fineprint { font-size: 11px !important; color: var(--ink-3); line-height: 1.6; margin-top: 12px; }
.hint { color: var(--ink-3); font-size: 13px; padding: 32px; }

/* Forms */
.fieldlabel { display: block; font-size: 11px; color: var(--ink-3); margin: 14px 0 6px; }
textarea, input[type=text] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  background: var(--field);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  resize: vertical;
}
textarea { min-height: 140px; }
.save { margin-top: 16px; }

/* Empty states */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 310px; justify-content: center; }
.empty-symbol { color: var(--accent); }
.empty h3 { font-size: 18px; margin: 12px 0 0; }
.empty p { color: var(--ink-2); font-size: 13px; margin: 8px 0 18px; }
.buttonstack { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

#toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--accent-line);
  padding: 12px 18px;
  font-family: var(--mono);
  font-size: 12px;
  opacity: 0;
  transform: translateY(16px);
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#toast.shown { opacity: 1; transform: translateY(0); }

@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
}

@media (max-width: 1300px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .twocol.unequal { grid-template-columns: 1.2fr 1fr; }
}
@media (max-width: 850px) {
  .sidebar { display: none; }
  .mobilelogo { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); }
  .topbar { padding: 12px 16px; }
  .twocol, .twocol.unequal { grid-template-columns: 1fr; }
  .metrics, .metrics.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main { padding: 20px 16px; }
  footer { padding: 16px; }
  h1 { font-size: 26px; }
  .feature-session { flex-wrap: wrap; }
}
@media (max-width: 540px) {
  .topactions { width: 100%; justify-content: space-between; }
  .periods button { padding: 0 10px; }
  .metrics, .metrics.four { gap: 8px; }
  .metric { padding: 14px 12px; }
  .metric strong { font-size: 24px; }
  .panel { padding: 14px; }
  .plot { height: 185px; }
  .panelhead { flex-wrap: wrap; }
  .fig { text-align: left; }
}

</style>

// ===== src/fit/decoder.js =====
/**
 * Minimal FIT binary decoder. This module knows nothing about swimming or the UI.
 *
 * Output: [{ global: FIT global message number, fields: { fieldNumber: value } }]
 * Unsupported developer fields are skipped rather than guessed.
 */

const FIT_EPOCH_MS = Date.UTC(1989, 11, 31);

// The low five bits of a FIT base-type byte describe the scalar type.
const TYPE_SIZES = {
  0: 1, 1: 1, 2: 1, 3: 2, 4: 2, 5: 4, 6: 4, 7: 1,
  8: 4, 9: 8, 10: 1, 11: 2, 12: 4, 13: 1, 14: 8, 15: 8, 16: 8
};

function fieldValue(fields, number) {
  return fields?.[number] ?? null;
}

function isNumber(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

function scaledValue(value, divisor) {
  return isNumber(value) ? value / divisor : null;
}

function fitDate(timestamp) {
  return isNumber(timestamp)
    ? new Date(FIT_EPOCH_MS + timestamp * 1000).toISOString()
    : null;
}

/** FIT invalid sentinels depend on the base type, not only its width. */
function readScalar(view, position, type, littleEndian) {
  const readUnsigned64 = () => view.getBigUint64(position, littleEndian);
  const readSigned64 = () => view.getBigInt64(position, littleEndian);
  let value;

  switch (type) {
    case 0: case 2: case 10: case 13: value = view.getUint8(position); break;
    case 1: value = view.getInt8(position); break;
    case 3: value = view.getInt16(position, littleEndian); break;
    case 4: case 11: value = view.getUint16(position, littleEndian); break;
    case 5: value = view.getInt32(position, littleEndian); break;
    case 6: case 12: value = view.getUint32(position, littleEndian); break;
    case 8: value = view.getFloat32(position, littleEndian); break;
    case 9: value = view.getFloat64(position, littleEndian); break;
    case 14: value = readSigned64(); break;
    case 15: case 16: value = readUnsigned64(); break;
    default: return null;
  }

  // 'z' unsigned types reserve ZERO as invalid; enum and byte reserve MAX.
  const invalid = {
    0: 255, 1: 127, 2: 255, 3: 32767, 4: 65535,
    5: 2147483647, 6: 4294967295, 10: 0, 11: 0, 12: 0,
    13: 255, 14: 9223372036854775807n,
    15: 18446744073709551615n, 16: 0n
  };
  if (value === invalid[type]) return null;
  if (typeof value === 'number') return Number.isFinite(value) ? value : null;

  // Keep 64-bit integers exact. Larger values remain bigint, not rounded floats.
  if (value <= BigInt(Number.MAX_SAFE_INTEGER) &&
      value >= BigInt(Number.MIN_SAFE_INTEGER)) return Number(value);
  return value;
}

function readField(view, position, size, baseType, littleEndian) {
  const type = baseType & 31;

  if (type === 7) {
    const bytes = new Uint8Array(view.buffer, view.byteOffset + position, size);
    return new TextDecoder().decode(bytes).replace(/\0.*$/, '').trim();
  }

  const scalarSize = TYPE_SIZES[type];
  if (!scalarSize || size % scalarSize !== 0) return null;

  if (size === scalarSize) {
    return readScalar(view, position, type, littleEndian);
  }

  const values = [];
  for (let offset = 0; offset < size; offset += scalarSize) {
    values.push(readScalar(view, position + offset, type, littleEndian));
  }
  return values;
}

/** Decode FIT global messages from an ArrayBuffer. */
function decodeMessages(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 16) throw new Error('File too short for a FIT activity.');

  const headerSize = view.getUint8(0);
  const signature = String.fromCharCode(...new Uint8Array(buffer, 8, 4));
  if (![12, 14].includes(headerSize) || signature !== '.FIT') {
    throw new Error('Not a valid FIT file header. Export a Garmin .fit activity.');
  }

  const messageEnd = headerSize + view.getUint32(4, true);
  if (messageEnd > view.byteLength) throw new Error('Truncated FIT file.');

  const definitions = new Map();
  const messages = [];
  let cursor = headerSize;
  let lastTimestamp = null;

  function ensureBytes(count, description) {
    if (cursor + count > messageEnd) throw new Error(`Truncated ${description}.`);
  }

  while (cursor < messageEnd) {
    const header = view.getUint8(cursor++);
    const compressed = (header & 0x80) !== 0;
    const localNumber = compressed ? (header >> 5) & 3 : header & 15;
    const definitionMessage = !compressed && (header & 0x40) !== 0;

    if (definitionMessage) {
      ensureBytes(5, 'FIT definition');
      cursor += 1; // reserved byte
      const littleEndian = view.getUint8(cursor++) === 0;
      const globalNumber = view.getUint16(cursor, littleEndian);
      cursor += 2;

      const fieldCount = view.getUint8(cursor++);
      const fields = [];
      for (let index = 0; index < fieldCount; index++) {
        ensureBytes(3, 'FIT field definition');
        fields.push({
          number: view.getUint8(cursor++),
          size: view.getUint8(cursor++),
          baseType: view.getUint8(cursor++)
        });
      }

      const developerFields = [];
      if ((header & 0x20) !== 0) {
        ensureBytes(1, 'FIT developer field count');
        const count = view.getUint8(cursor++);
        for (let index = 0; index < count; index++) {
          ensureBytes(3, 'FIT developer field definition');
          developerFields.push({
            number: view.getUint8(cursor++),
            size: view.getUint8(cursor++),
            developer: view.getUint8(cursor++)
          });
        }
      }

      definitions.set(localNumber, { globalNumber, littleEndian, fields, developerFields });
      continue;
    }

    const definition = definitions.get(localNumber);
    if (!definition) throw new Error('FIT data references a missing definition.');

    const values = {};
    for (const field of definition.fields) {
      // The compressed timestamp header replaces field 253; it has no payload bytes.
      if (compressed && field.number === 253) continue;
      ensureBytes(field.size, 'FIT data');
      values[field.number] = readField(view, cursor, field.size, field.baseType, definition.littleEndian);
      cursor += field.size;
    }
    for (const field of definition.developerFields) {
      ensureBytes(field.size, 'FIT developer data');
      cursor += field.size;
    }

    if (compressed && isNumber(lastTimestamp)) {
      const offset = header & 31;
      let timestamp = lastTimestamp - (lastTimestamp % 32) + offset;
      if (timestamp < lastTimestamp) timestamp += 32;
      values[253] ??= timestamp;
    }
    if (isNumber(values[253])) lastTimestamp = values[253];

    messages.push({ global: definition.globalNumber, fields: values });
  }

  return messages;
}



// ===== src/fit/swimming-parser.js =====
/**
 * Translate the FIT messages into MySwimLab's device-independent SwimSession.
 * See docs/data-model.md for the complete shape and units.
 */
const GLOBAL_SESSION = 18;
const GLOBAL_RECORD = 20;
const GLOBAL_LENGTH = 101;
const SPORT_SWIMMING = 5;
const SUB_SPORT_POOL = 17;
const SUB_SPORT_OPEN_WATER = 18;

function convertLength(message, poolMeters, sequence) {
  const fields = message.fields;
  const isRest = fieldValue(fields, 12) === 0;

  return {
    index: fieldValue(fields, 254),
    sequence,
    start: fitDate(fieldValue(fields, 2)),
    end: fitDate(fieldValue(fields, 253)),
    duration: scaledValue(fieldValue(fields, 4), 1000)
      ?? scaledValue(fieldValue(fields, 3), 1000),
    elapsed: scaledValue(fieldValue(fields, 3), 1000),
    strokes: fieldValue(fields, 5),
    cadence: fieldValue(fields, 9),
    stroke: fieldValue(fields, 7),
    speed: scaledValue(fieldValue(fields, 6), 1000),
    isRest,
    distance: isRest ? 0 : poolMeters
  };
}

function sessionTitle(filename) {
  const title = filename.replace(/\.fit$/i, '').replace(/[_-]/g, ' ');
  return /^\d+\s*activity$/i.test(title) ? 'Swimming session' : title;
}

/**
 * @param {ArrayBuffer} buffer - A raw FIT file.
 * @param {string} filename - Original file name (used for display only).
 * @returns {object} A normalized SwimSession.
 */
function parseFit(buffer, filename = 'Garmin swim', options = {}) {
  const messages = decodeMessages(buffer);
  const sessionMessages = messages.filter(message => message.global === GLOBAL_SESSION);
  const lengthMessages = messages.filter(message => message.global === GLOBAL_LENGTH);
  const recordMessages = messages.filter(message => message.global === GLOBAL_RECORD);

  const swimmingSessions = sessionMessages.filter(message =>
    fieldValue(message.fields, 5) === SPORT_SWIMMING);
  if (swimmingSessions.length > 1) {
    // Do not merge several workouts' lengths into one misleading activity.
    throw new Error('Multi-session FIT files are not yet supported.');
  }
  const session = swimmingSessions[0] ?? sessionMessages[0];

  if (!session && lengthMessages.length === 0) {
    throw new Error('This FIT file does not contain a swimming session.');
  }

  const fields = session?.fields ?? {};
  const sport = fieldValue(fields, 5);
  if (session && isNumber(sport) && sport !== SPORT_SWIMMING) {
    throw new Error('This FIT file contains a non-swimming activity.');
  }

  // FIT pool_length is ALWAYS hundredths of a meter, even for a yard pool.
  // pool_length_unit controls the display unit only (0=m, 1=yd).
  const poolMeters = scaledValue(fieldValue(fields, 44), 100) || 25;
  const poolUnit = fieldValue(fields, 46) === 1 ? 'yd' : 'm';
  const lengths = lengthMessages.map((message, index) => convertLength(message, poolMeters, index));
  const activeLengths = lengths.filter(length => !length.isRest);

  let distance = scaledValue(fieldValue(fields, 9), 100);
  if (!isNumber(distance) || distance <= 0) {
    distance = activeLengths.reduce((total, length) => total + length.distance, 0);
  }

  const subSport = fieldValue(fields, 6);
  const swimType = subSport === SUB_SPORT_POOL ? 'pool'
    : subSport === SUB_SPORT_OPEN_WATER ? 'open-water'
    : lengths.length > 0 ? 'pool' : 'open-water';

  // A pool session's FIT total_timer_time can include rests between sets.
  // The actual swimming time is the sum of ACTIVE length durations, not that
  // session timer. Garmin records rest periods as idle length messages.
  const timerDuration = scaledValue(fieldValue(fields, 8), 1000);
  const activeDuration = activeLengths.reduce((total, length) =>
    total + (isNumber(length.duration) && length.duration > 0 ? length.duration : 0), 0);
  const restDuration = lengths.reduce((total, length) =>
    total + (length.isRest && isNumber(length.duration) && length.duration > 0
      ? length.duration : 0), 0);

  // Some Garmin Swim files also contain a nonstandard session field 78
  // (total_swim_time). Use it only if active length durations are unavailable.
  const swimTimeField = scaledValue(fieldValue(fields, 78), 1000);
  let duration = timerDuration;
  let durationBasis = 'timer';
  if (swimType === 'pool' && activeDuration > 0) {
    duration = activeDuration;
    durationBasis = 'active-lengths';
  } else if (swimType === 'pool' && isNumber(swimTimeField) && swimTimeField > 0) {
    duration = swimTimeField;
    durationBasis = 'session-swim-time';
  }
  if (!isNumber(duration) || duration <= 0) {
    duration = activeDuration;
    durationBasis = 'active-lengths';
  }

  const elapsed = scaledValue(fieldValue(fields, 7), 1000) || timerDuration || duration;
  const start = fitDate(fieldValue(fields, 2))
    ?? lengths.find(length => length.start)?.start
    ?? fitDate(fieldValue(recordMessages[0]?.fields, 253))
    ?? options.fallbackDate
    ?? '1989-12-31T00:00:00.000Z';

  return {
    id: options.fileHash && !fitDate(fieldValue(fields, 2)) &&
      !lengths.some(length => length.start) && !fitDate(fieldValue(recordMessages[0]?.fields, 253))
      ? `fit-sha256-${options.fileHash}`
      // Keep v0.4.1 IDs stable so existing local annotations are still found.
      : `fit-${start}-${Math.round(distance)}-${(timerDuration || duration).toFixed(1)}`,
    date: start,
    title: sessionTitle(filename),
    filename,
    source: 'FIT',
    sport: swimType,
    poolMeters: swimType === 'pool' ? poolMeters : null,
    poolUnit: swimType === 'pool' ? poolUnit : null,
    distance: Math.round(distance * 100) / 100,
    duration: Number(duration.toFixed(3)), // Rest-excluded swimming time for pool sessions.
    timerDuration: isNumber(timerDuration) ? Number(timerDuration.toFixed(3)) : null,
    restDuration: swimType === 'pool' ? Number(restDuration.toFixed(3)) : null,
    durationBasis,
    elapsed: Number(elapsed.toFixed(3)),
    averageHR: isNumber(fieldValue(fields, 16)) ? fieldValue(fields, 16) : null,
    lengths,
    notes: '',
    equipment: [],
    importedAt: new Date().toISOString()
  };
}



// ===== src/analytics/length-quality.js =====
/**
 * Quality control for individual pool lengths.
 *
 * FIT records are never edited. We automatically exclude only unusually fast
 * lengths that ALSO have unusually few strokes. This conservative two-signal
 * rule avoids rejecting genuine sprint efforts on pace alone.
 *
 * Users may override either decision. Overrides are keyed by stable FIT record
 * sequence; they are stored with annotations, not in the original FIT file.
 */
const MIN_REFERENCE_LENGTHS = 8;
const FAST_TIME_RATIO = 0.60;
const LOW_STROKE_RATIO = 0.65;

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function active(length) {
  return length && !length.isRest && Number.isFinite(length.duration) && length.duration > 0 &&
    Number.isFinite(length.distance) && length.distance > 0;
}

/**
 * Session medians used by the automatic rule, or null when there are fewer
 * than MIN_REFERENCE_LENGTHS active lengths with stroke counts.
 * Returns { timePerMeter, strokes }.
 */
function qualityBaseline(session) {
  const reference = (session.lengths || []).filter(length =>
    active(length) && Number.isFinite(length.strokes) && length.strokes > 0);
  if (reference.length < MIN_REFERENCE_LENGTHS) return null;
  return {
    timePerMeter: median(reference.map(length => length.duration / length.distance)),
    strokes: median(reference.map(length => length.strokes))
  };
}

/**
 * Returns one result per source record, including rest markers.
 * Each result has { excluded, automatic, reason, manual }.
 * Results are deterministic, calculated only from a normalized SwimSession.
 */
function assessLengths(session) {
  const lengths = session.lengths || [];
  const baseline = qualityBaseline(session);
  const baselineTime = baseline?.timePerMeter ?? null;
  const baselineStrokes = baseline?.strokes ?? null;
  const overrides = session.lengthOverrides || {};

  return lengths.map((length, index) => {
    const sequence = Number.isInteger(length.sequence) ? length.sequence : index;
    const choice = overrides[String(sequence)];
    const isCandidate = active(length) && baselineTime !== null &&
      Number.isFinite(length.strokes) && length.strokes >= 0 &&
      length.duration / length.distance < baselineTime * FAST_TIME_RATIO &&
      length.strokes < baselineStrokes * LOW_STROKE_RATIO;

    // An explicitly kept length can override an automatic suspicion.
    const excluded = choice === 'exclude' || (isCandidate && choice !== 'keep');
    return {
      excluded,
      automatic: isCandidate,
      manual: choice === 'exclude' ? 'exclude' : choice === 'keep' ? 'keep' : null,
      reason: isCandidate ? 'Exceptionally fast with unusually few strokes' : null
    };
  });
}

/**
 * Return totals suitable for a quality-filtered pace estimate.
 * Only adjust a pool session when active lengths cover the reported FIT
 * swimming distance and duration; otherwise retain the session totals.
 */
function paceTotals(session) {
  const original = { distance: session.distance || 0, duration: session.duration || 0, excluded: 0 };
  if (session.sport !== 'pool' || session.durationBasis !== 'active-lengths') return original;

  const lengths = session.lengths || [];
  const activeLengths = lengths.filter(active);
  const fullDistance = activeLengths.reduce((sum, length) => sum + length.distance, 0);
  const fullDuration = activeLengths.reduce((sum, length) => sum + length.duration, 0);
  if (Math.abs(fullDistance - session.distance) > 0.5 ||
      Math.abs(fullDuration - session.duration) > 0.5) return original;

  const assessments = assessLengths(session);
  const excluded = lengths.filter((length, index) => active(length) && assessments[index].excluded);
  if (!excluded.length) return original;

  const removedDistance = excluded.reduce((sum, length) => sum + length.distance, 0);
  const removedDuration = excluded.reduce((sum, length) => sum + length.duration, 0);
  return {
    distance: Math.max(0, session.distance - removedDistance),
    duration: Math.max(0, session.duration - removedDuration),
    excluded: excluded.length
  };
}



// ===== src/analytics/best-efforts.js =====
/**
 * Find the fastest continuous segments of exactly the requested distances.
 *
 * Input is an array of normalized SwimSession objects, not raw FIT messages.
 * A rest marker, missing length, or invalid duration stops a segment.
 */
/** @param {string} unit - 'm' or 'yd'; units are never mixed. */
function distanceBests(sessions, targets = [25, 50, 100, 200, 400, 800], unit = 'm') {
  const results = [];

  for (const target of targets) {
    let best = null;
    const targetMeters = unit === 'yd' ? target * 0.9144 : target;

    for (const session of sessions) {
      if (session.sport !== 'pool') continue;
      if ((session.poolUnit || 'm') !== unit) continue;

      const lengths = session.lengths || [];
      const flags = assessLengths(session);
      for (let start = 0; start < lengths.length; start++) {
        const first = lengths[start];
        if (!isActiveLength(first) || flags[start].excluded) continue;

        let distance = 0;
        let time = 0;

        for (let end = start; end < lengths.length; end++) {
          const length = lengths[end];
          if (!isActiveLength(length) || flags[end].excluded) break;
          if (end > start && !isConsecutive(lengths[end - 1], length)) break;

          distance += length.distance;
          time += length.duration;

          // Allow a small FIT rounding error, not a yard/meter crossover.
          if (Math.abs(distance - targetMeters) <= 0.05) {
            if (!best || time < best.time) {
              // start and end are indexes into session.lengths (inclusive).
              best = { distance: target, distanceMeters: targetMeters, unit, time, session, start, end };
            }
            break;
          }
          if (distance > targetMeters + 0.05) break;
        }
      }
    }

    results.push(best || { distance: target, distanceMeters: targetMeters, unit, time: null, session: null });
  }
  return results;
}

function isActiveLength(length) {
  return length && !length.isRest && length.duration > 0 && length.distance > 0;
}

function isConsecutive(previous, current) {
  if (Number.isInteger(previous.sequence) && Number.isInteger(current.sequence)) {
    if (current.sequence !== previous.sequence + 1) return false;
  }
  if (Number.isInteger(previous.index) && Number.isInteger(current.index)) {
    if (current.index !== previous.index + 1) return false;
  }
  return true;
}



// ===== src/analytics/metrics.js =====
/** Pure calculations over normalized swimming sessions. No DOM or FIT parsing. */
function pace(session) {
  if (!session) return null;
  const totals = paceTotals(session);
  return totals.distance > 0 && totals.duration > 0
    ? (totals.duration * 100) / totals.distance : null;
}

function summary(sessions) {
  const distance = sessions.reduce((total, session) => total + session.distance, 0);
  const duration = sessions.reduce((total, session) => total + session.duration, 0);
  const qualityTotals = sessions.map(paceTotals);
  const paceDistance = qualityTotals.reduce((total, item) => total + item.distance, 0);
  const paceDuration = qualityTotals.reduce((total, item) => total + item.duration, 0);
  const excluded = qualityTotals.reduce((total, item) => total + item.excluded, 0);
  const activeLengths = sessions.flatMap(session => {
    const flags = assessLengths(session);
    return (session.lengths || []).filter((length, index) =>
      active(length) && !flags[index].excluded);
  });
  const lengthsWithStrokes = activeLengths.filter(length => Number.isFinite(length.strokes));

  const meanStrokes = lengthsWithStrokes.length
    ? lengthsWithStrokes.reduce((total, length) => total + length.strokes, 0) / lengthsWithStrokes.length
    : null;

  return {
    sessions: sessions.length,
    distance,
    duration,
    // Keep recorded distance and time intact. Only pace/stroke analytics are filtered.
    pace: paceDistance > 0 ? paceDuration * 100 / paceDistance : null,
    excluded,
    stroke: meanStrokes,
    strokeLengths: lengthsWithStrokes.length, // Sample size for `stroke`.
    activeLengths: activeLengths.length
  };
}

function lengthDrift(session) {
  const flags = assessLengths(session || { lengths: [] });
  const lengths = (session?.lengths || [])
    .filter((length, index) => !length.isRest && !flags[index].excluded &&
      Number.isFinite(length.strokes));
  if (lengths.length < 8) return null;

  const count = Math.max(2, Math.floor(lengths.length / 4));
  const average = entries => entries.reduce((total, length) => total + length.strokes, 0) / entries.length;
  const first = average(lengths.slice(0, count));
  const last = average(lengths.slice(-count));
  return first > 0 ? 100 * (last - first) / first : null;
}

function weekVolumes(sessions) {
  const totals = new Map();

  for (const session of sessions) {
    const date = new Date(session.date);
    // Group by the user's local calendar week, not UTC midnight.
    const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);

    const week = [monday.getFullYear(), String(monday.getMonth() + 1).padStart(2, '0'),
      String(monday.getDate()).padStart(2, '0')].join('-');
    totals.set(week, (totals.get(week) || 0) + session.distance);
  }

  return [...totals].sort(([a], [b]) => a.localeCompare(b)).map(([week, meters]) => ({
    label: formatDate(`${week}T12:00:00`, { month: 'short', day: 'numeric' }),
    value: meters / 1000
  }));
}

// Formatting is presentation-only; kept separate from the numeric functions above.
function formatNumber(value, decimals = 0) {
  return Number.isFinite(value)
    ? value.toLocaleString('en-US', { maximumFractionDigits: decimals })
    : '—';
}

function formatSeconds(value) {
  if (!Number.isFinite(value)) return '—';
  const rounded = Math.round(value);
  return `${Math.floor(rounded / 60)}:${String(rounded % 60).padStart(2, '0')}`;
}

function formatDuration(value) {
  if (!Number.isFinite(value)) return '—';
  const rounded = Math.round(value);
  const hours = Math.floor(rounded / 3600);
  const minutes = Math.floor((rounded % 3600) / 60);
  const seconds = rounded % 60;
  return `${hours ? `${hours}:` : ''}${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function formatDate(value, options = { month: 'short', day: 'numeric', year: 'numeric' }) {
  return new Date(value).toLocaleDateString('en-GB', options);
}



// ===== src/analytics/intervals.js =====
/**
 * Swim intervals derived from pool lengths. Garmin closes an interval when the
 * swimmer starts a rest, so the active lengths between rest markers are one
 * interval. Values are as recorded: quality decisions do not change them.
 */
/**
 * @returns {{first: number, last: number, lengths: number, distance: number,
 *   duration: number, strokes: number|null, rest: number|null}[]}
 *   `first`/`last` are length indices; distance is meters; times are seconds.
 */
function intervals(session) {
  const result = [];
  let current = null;

  (session?.lengths || []).forEach((length, index) => {
    if (length.isRest) {
      if (current) {
        current.rest = (current.rest ?? 0) + (Number.isFinite(length.duration) ? length.duration : 0);
      }
      return;
    }
    if (!active(length)) return;
    if (!current || current.rest !== null) {
      current = { first: index, last: index, lengths: 0, distance: 0, duration: 0, strokes: 0, rest: null };
      result.push(current);
    }
    current.last = index;
    current.lengths += 1;
    current.distance += length.distance;
    current.duration += length.duration;
    current.strokes = Number.isFinite(length.strokes) && current.strokes !== null
      ? current.strokes + length.strokes : null;
  });

  return result;
}

/** Group consecutive intervals with the same number of lengths, e.g. 5 × 200 m. */
function intervalSets(list) {
  const sets = [];
  for (const interval of list) {
    const previous = sets[sets.length - 1];
    if (previous && previous.intervals[0].lengths === interval.lengths) {
      previous.intervals.push(interval);
    } else {
      sets.push({ intervals: [interval] });
    }
  }
  return sets;
}



// ===== src/data/fit-import.js =====
/**
 * Read FIT files from browser File objects.
 * No DOM manipulation, storage access, or global UI state in this module.
 */
const MAX_FILES = 300;
const MAX_FILE_BYTES = 25 * 1024 * 1024;

/**
 * @param {File[]} files
 * @returns {Promise<{sessions: object[], failures: string[], ignored: number}>}
 */
async function parseFitFiles(files) {
  const candidates = files.filter(file => file.name.toLowerCase().endsWith('.fit'));
  if (candidates.length > MAX_FILES) {
    throw new Error(`Selection contains over ${MAX_FILES} FIT files. Choose fewer files.`);
  }
  const sessions = [];
  const failures = [];
  const seen = new Set();
  let ignored = 0;

  for (const file of candidates) {
    if (file.size > MAX_FILE_BYTES) {
      failures.push(`${file.name}: exceeds 25 MB`);
      continue;
    }

    try {
      const buffer = await file.arrayBuffer();
      // Hash every file. parseFit uses the hash as the ID only when the file has
      // no FIT activity timestamp. A per-file SHA-256 also allows future
      // importers to identify duplicates.
      const hashBytes = await crypto.subtle.digest('SHA-256', buffer);
      const fileHash = [...new Uint8Array(hashBytes)]
        .map(byte => byte.toString(16).padStart(2, '0')).join('');
      const fallbackDate = Number.isFinite(file.lastModified) && file.lastModified > 0
        ? new Date(file.lastModified).toISOString()
        : '1989-12-31T00:00:00.000Z';
      const session = parseFit(buffer, file.name, { fileHash, fallbackDate });
      if (seen.has(session.id)) continue;
      seen.add(session.id);
      sessions.push(session);
    } catch (error) {
      const expected = /non-swimming activity|does not contain a swimming session/i;
      if (expected.test(error.message)) ignored++;
      else failures.push(`${file.name}: ${error.message}`);
    }
  }

  return { sessions, failures, ignored };
}



// ===== src/data/backup.js =====
/** Analytics and views read these length fields without further checks. */
function validLength(length) {
  return length !== null && typeof length === 'object' && !Array.isArray(length) &&
    typeof length.isRest === 'boolean' &&
    Number.isFinite(length.distance) && length.distance >= 0 &&
    (length.duration === null || Number.isFinite(length.duration));
}

/** Validation before any write. Backups are untrusted JSON from the user's disk. */
function validateBackup(value) {
  if (!value || value.format !== 'myswimlab' || !Array.isArray(value.sessions)) {
    throw new Error('Not a MySwimLab backup.');
  }
  const ids = new Set();
  for (const [index, session] of value.sessions.entries()) {
    const validDate = typeof session?.date === 'string' &&
      Number.isFinite(Date.parse(session.date));
    const valid = typeof session?.id === 'string' && session.id.length > 0 &&
      validDate && Array.isArray(session.lengths) && session.lengths.every(validLength) &&
      [undefined, null, 'm', 'yd'].includes(session.poolUnit) &&
      Number.isFinite(session.distance) && session.distance >= 0 &&
      Number.isFinite(session.duration) && session.duration >= 0 &&
      typeof session.sport === 'string' &&
      (session.notes === undefined || typeof session.notes === 'string') &&
      (session.lengthOverrides === undefined || (session.lengthOverrides !== null &&
        typeof session.lengthOverrides === 'object' && !Array.isArray(session.lengthOverrides) &&
        Object.entries(session.lengthOverrides).every(([key, decision]) =>
          /^(0|[1-9]\d*)$/.test(key) && ['keep', 'exclude'].includes(decision)))) &&
      (session.equipment === undefined ||
       Array.isArray(session.equipment) && session.equipment.every(e => typeof e === 'string'));
    if (!valid) throw new Error(`Invalid session entry at position ${index + 1}.`);
    if (ids.has(session.id)) throw new Error(`Duplicate session ID at position ${index + 1}.`);
    ids.add(session.id);
  }
  return value.sessions;
}



// ===== src/data/storage.js =====
/**
 * Browser-only persistence. Imported FIT records are NOT a startup data source.
 * A saved annotation stores the FULL normalized session object, including
 * individual lengths, in IndexedDB. Cached sessions are never loaded as the
 * app's startup history; they are consulted only for annotation recovery.
 */
const DATABASE_NAME = 'myswimlab-local-v1'; // Keep name for v0.3.1 compatibility
const DATABASE_VERSION = 2;
const SESSION_STORE = 'sessions';

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DATABASE_NAME, DATABASE_VERSION);

    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(SESSION_STORE)) {
        database.createObjectStore(SESSION_STORE, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => {
      // Let a newer version in another tab upgrade the database.
      request.result.onversionchange = () => request.result.close();
      resolve(request.result);
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Close other MySwimLab tabs, then try again.'));
  });
}

async function transaction(storeName, mode, makeRequest) {
  const database = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = database.transaction(storeName, mode);
    const request = makeRequest(tx.objectStore(storeName));
    let result;

    request.onsuccess = () => { result = request.result; };
    request.onerror = () => reject(request.error);
    tx.oncomplete = () => { database.close(); resolve(result); };
    tx.onerror = () => { database.close(); reject(tx.error); };
    tx.onabort = () => { database.close(); reject(tx.error); };
  });
}

const loadAnnotations = () => transaction(SESSION_STORE, 'readonly', store => store.getAll());
const saveAnnotations = session => transaction(SESSION_STORE, 'readwrite', store => store.put(session));

/** Commit a complete restore in one IndexedDB transaction (all or nothing). */
async function saveAnnotationsBatch(sessions) {
  const database = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = database.transaction(SESSION_STORE, 'readwrite');
    const store = tx.objectStore(SESSION_STORE);
    for (const session of sessions) store.put(session);
    tx.oncomplete = () => { database.close(); resolve(); };
    tx.onerror = () => { database.close(); reject(tx.error); };
    tx.onabort = () => { database.close(); reject(tx.error); };
  });
}
const deleteAnnotations = id => transaction(SESSION_STORE, 'readwrite', store => store.delete(id));
const clearAnnotations = () => transaction(SESSION_STORE, 'readwrite', store => store.clear());



// ===== src/state.js =====
/** The in-memory state is the only source of data displayed by the dashboard. */
const state = {
  sessions: [],
  page: 'overview',
  selectedSessionId: null,
  period: 'all',
  drafts: new Map()
};

function sortedSessions() {
  return [...state.sessions].sort((a, b) => b.date.localeCompare(a.date));
}

function selectedSession() {
  const sessions = sortedSessions();
  return sessions.find(session => session.id === state.selectedSessionId) ?? sessions[0] ?? null;
}

/** Time windows are relative to the latest imported workout, not today's date. */
function visibleSessions() {
  const sessions = sortedSessions();
  if (state.period === 'all' || sessions.length === 0) return sessions;

  const lastDate = new Date(sessions[0].date).getTime();
  const intervalMs = Number(state.period) * 86400000;
  return sessions.filter(session => lastDate - new Date(session.date).getTime() < intervalMs);
}

function replaceSessions(sessions) {
  state.sessions = sessions;
  state.selectedSessionId = null;
  state.page = 'overview';
  state.period = 'all';
}

/** Basic HTML helpers, with escaping applied to untrusted FIT metadata. */
const query = selector => document.querySelector(selector);

function escapeHtml(value) {
  const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value ?? '').replace(/[&<>"']/g, character => replacements[character]);
}

/** Zero-based length index → the record number shown to users, e.g. "017". */
function recordNumber(index) {
  return String(index + 1).padStart(3, '0');
}

function tag(text, kind = '') {
  return `<span class="tag ${escapeHtml(kind)}">${escapeHtml(text)}</span>`;
}

function icon(name, size = 20) {
  const paths = {
    wave: '<path d="M2 9c4-4 6-4 10 0s6 4 10 0M2 15c4-4 6-4 10 0s6 4 10 0"/>',
    upload: '<path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18"/>',
    chart: '<path d="M3 21V9m5 12V4m5 17v-9m5 9V2"/>'
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${paths[name] || ''}</svg>`;
}



// ===== src/ui/charts.js =====
/** Small SVG/HTML chart renderers. No charting library or server required. */
/**
 * Colors come from CSS custom properties so the theme controls them.
 * `band` shades data indexes `from`..`to` (inclusive) with an optional label.
 */
function lineChart(data, { color = 'var(--accent)', fill = false, unit = '', label = '', band = null } = {}) {
  if (!data.length) return '<div class="empty-chart">Upload sessions to see a trend</div>';

  const values = data.map(item => item.value).filter(Number.isFinite);
  if (!values.length) return '<div class="empty-chart">No comparable data yet</div>';

  const width = 640;
  const height = 220;
  const left = 52;
  const right = 18;
  const top = 18;
  const bottom = 40;
  const minimum = Math.min(...values);
  const maximum = Math.max(...values);
  const margin = Math.max((maximum - minimum) * 0.24, 0.5);
  const lower = minimum - margin;
  const upper = maximum + margin;

  const x = index => left + index * (width - left - right) / Math.max(1, data.length - 1);
  const y = value => top + (upper - value) * (height - top - bottom) / (upper - lower);
  const points = data.map((item, index) => `${x(index)},${y(item.value)}`).join(' ');

  const grid = [0, 1, 2, 3, 4].map(index => {
    const gridY = top + index * (height - top - bottom) / 4;
    const value = upper - index * (upper - lower) / 4;
    const caption = unit === 'pace' ? formatSeconds(value) : formatNumber(value, 1);
    return `
      <line class="chart-grid" x1="${left}" y1="${gridY}" x2="${width - right}" y2="${gridY}"/>
      <text class="chart-text" x="${left - 9}" y="${gridY + 4}" text-anchor="end" font-size="11">${caption}</text>`;
  }).join('');

  const labels = data.map((item, index) => {
    if (data.length > 8 && index % Math.ceil(data.length / 6) !== 0) return '';
    return `<text class="chart-text" x="${x(index)}" y="${height - 13}" text-anchor="middle" font-size="11">${escapeHtml(item.label)}</text>`;
  }).join('');

  const area = fill
    ? `<polygon points="${left},${height - bottom} ${points} ${x(data.length - 1)},${height - bottom}" style="fill:${color}" opacity=".08"/>`
    : '';

  // Half a step on each side, so a one-point band still has a width.
  const step = (width - left - right) / Math.max(1, data.length - 1);
  const shade = band ? `
      <rect class="chart-band" x="${Math.max(left, x(band.from) - step / 2)}" y="${top}"
        width="${Math.min(width - right, x(band.to) + step / 2) - Math.max(left, x(band.from) - step / 2)}" height="${height - top - bottom}"/>
      ${band.label ? `<text class="chart-band-text" x="${(x(band.from) + x(band.to)) / 2}" y="${top + 14}" text-anchor="middle" font-size="11">${escapeHtml(band.label)}</text>` : ''}` : '';

  return `
    <svg class="plot" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(label || 'Time series')}" preserveAspectRatio="none">
      ${grid}
      ${shade}
      ${area}
      <polyline points="${points}" style="stroke:${color}" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      ${data.map((item, index) => `<rect class="chart-point" x="${x(index) - 3.5}" y="${y(item.value) - 3.5}" width="7" height="7" style="stroke:${color}"/>`).join('')}
      <line class="chart-axis" x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}"/>
      ${labels}
    </svg>`;
}

function barChart(data) {
  if (!data.length) return '<div class="empty-chart">Upload sessions to see a trend</div>';
  const maximum = Math.max(1, ...data.map(item => item.value));

  return `<div class="bars">${data.map(item => `
    <div class="barcol">
      <div class="bar-track">
        <div class="bar-fill" style="height:${Math.max(3, item.value / maximum * 100)}%" title="${item.value.toFixed(2)} km"></div>
      </div>
      <small>${escapeHtml(item.label)}</small>
    </div>`).join('')}</div>`;
}

      <div class="metric-top"><span>${escapeHtml(title)}</span></div>
      <strong>${valueHtml}</strong>
      <p class="${tone === 'warn' ? 'warn' : ''}">${escapeHtml(description)}</p>

function metricCards(sessions) {
  const total = summary(sessions);
  const pool = sessions.filter(session => session.sport === 'pool').length;
  return `
    <div class="metrics">
      ${metric('Dist · total', `${formatNumber(total.distance / 1000, 2)} <small>km</small>`, `Σ ${total.sessions} ${total.sessions === 1 ? 'session' : 'sessions'}`)}
      ${metric('Sessions', formatNumber(total.sessions), `pool ${pool} · open water ${total.sessions - pool}`)}
      ${metric(total.excluded ? 'Pace · filtered' : 'Pace · average', `${formatSeconds(total.pace)} <small>/100m</small>`, total.excluded ? `▲ ${total.excluded} suspect ${total.excluded === 1 ? 'length' : 'lengths'} excluded · totals unchanged` : 'Moving time, distance weighted', total.excluded ? 'warn' : '')}
      ${metric('Strokes / length', formatNumber(total.stroke, 1), total.strokeLengths ? `μ · n=${formatNumber(total.strokeLengths)} lengths` : 'No stroke data')}
      ${metric('Swim time', formatDuration(total.duration), 'Moving time')}
    </div>`;
}

/** IDs of sessions that hold a current best for any distance, over all loaded sessions. */
function personalBestIds() {
  const all = sortedSessions();
  const ids = new Set();
  for (const unit of ['m', 'yd']) {
    for (const effort of distanceBests(all, [25, 50, 100, 200, 400, 800, 1500], unit)) {
      if (effort.session) ids.add(effort.session.id);
    }
  }
  return ids;
}

}

function recentTable(sessions, compact = false) {
  if (!sessions.length) {
    return emptyState('No sessions yet', 'Import Garmin FIT activities to see your training history.');
  }

  const visible = compact ? sessions.slice(0, 6) : sessions;
  const bests = personalBestIds();
  const rows = visible.map(session => {
    const suspect = assessLengths(session).filter(flag => flag.excluded).length;
    return `
    <tr data-select="${escapeHtml(session.id)}">
      <td>${formatDate(session.date)}</td>
      <td class="strong"><button class="session-link" data-select="${escapeHtml(session.id)}">${escapeHtml(session.title)}</button>${bests.has(session.id) ? ' <span class="pb-mark" title="Holds a current personal best">PB</span>' : ''}</td>
      <td>${formatNumber(session.distance)} m</td>
      <td>${formatDuration(session.duration)}</td>
      <td>${formatSeconds(pace(session))}</td>
      <td>${formatNumber(summary([session]).stroke, 1)}</td>
      <td class="${suspect ? 'warn' : 'muted'}">${suspect ? `▲ ${suspect}` : '—'}</td>
      <td>${tag(session.source, 'real')}</td>
      <td class="arrow">›</td>
    </tr>`;
  }).join('');

  return `
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Workout</th><th>Dist</th><th>Swim time</th>
          <th>Pace /100m</th><th>Str/len</th><th title="Lengths excluded by quality control">QC</th><th>Src</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function lengthTable(session) {
  const lengths = session.lengths || [];
  if (!lengths.length) return '<div class="hint">No individual pool lengths in this activity.</div>';

  const flags = assessLengths(session);
  const rows = lengths.map((length, index) => {
    const flag = flags[index];
    const sequence = Number.isInteger(length.sequence) ? length.sequence : index;
    const status = flag.manual === 'keep' ? 'Kept manually'
      : flag.manual === 'exclude' ? 'Excluded manually'
      : flag.excluded ? 'Suspected artifact' : '';
    const action = length.isRest ? '' : flag.manual
      ? `<button class="quality-action" data-quality-sequence="${sequence}" data-quality-decision="reset"
          aria-label="Reset quality decision for record ${index + 1}">Reset</button>`
      : flag.excluded
        ? `<button class="quality-action" data-quality-sequence="${sequence}" data-quality-decision="keep"
            aria-label="Keep record ${index + 1} in analytics">Keep</button>`
        : `<button class="quality-action" data-quality-sequence="${sequence}" data-quality-decision="exclude"
            aria-label="Exclude record ${index + 1} from analytics">Exclude</button>`;
    return `
      <tr id="length-${index}" class="${flag.excluded ? 'excluded-length' : ''}">
        <td>${flag.excluded ? '▲ ' : ''}${recordNumber(index)}</td>
        <td>${length.isRest ? tag('Rest') : tag('Swim', 'real')}</td>
        <td>${formatSeconds(length.duration)}</td>
        <td>${length.isRest || !length.distance ? '—' : formatSeconds(length.duration * 100 / length.distance)}</td>
        <td>${formatNumber(length.strokes)}</td>
        <td>${formatNumber(length.cadence)}</td>
        <td><span class="quality-status" title="${escapeHtml(flag.reason || '')}">${status}</span> ${action}</td>
      </tr>`;
  }).join('');

  return `
    <div class="length-scroll">
      <table>
        <thead><tr><th>Rec</th><th>Type</th><th>Duration</th><th>Pace</th><th>Strokes</th><th>Cadence</th><th>Quality control</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/** Workout structure (e.g. "5 × 200 m · 100 m") and one row per interval. */
function intervalTable(session) {
  const sets = intervalSets(intervals(session));
  if (!sets.length) return '';

  const unit = escapeHtml(session.poolUnit || 'm');
  const pool = session.poolUnit === 'yd' ? session.poolMeters / 0.9144 : session.poolMeters;
  const distance = interval => interval.lengths * pool;
  const setName = set => `${set.intervals.length > 1 ? `${set.intervals.length} × ` : ''}${formatNumber(distance(set.intervals[0]))} ${unit}`;

  const rows = sets.map(set => set.intervals.map((interval, position) => `
      <tr class="interval-row${position === 0 ? ' set-start' : ''}">
        <td class="set-name">${position === 0 ? setName(set) : ''}</td>
        <td>${position + 1}</td>
        <td>${formatNumber(distance(interval))} ${unit}</td>
        <td>${formatSeconds(interval.duration)}</td>
        <td>${formatSeconds(interval.duration * 100 / distance(interval))}</td>
        <td>${formatNumber(interval.strokes)}</td>
        <td>${formatSeconds(interval.rest)}</td>
        <td>${interval.rest === null ? '—' : formatSeconds(interval.duration + interval.rest)}</td>
      </tr>`).join('')).join('');

  return `
    <p class="interval-summary">${sets.map(setName).join(' · ')}</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Set</th><th>#</th><th>Dist</th><th>Time</th><th>Pace /100${unit}</th><th>Strokes</th><th>Rest after</th><th>Restart after</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function sessionInsight(sessions) {
  if (sessions.length < 2) return 'Add more sessions with valid distance and duration to explore pace changes.';

  const ordered = [...sessions].sort((a, b) => a.date.localeCompare(b.date));
  const first = ordered[0];
  const last = ordered[ordered.length - 1];
  const firstPace = pace(first);
  const lastPace = pace(last);
  if (!firstPace || !lastPace) return 'Add more sessions with valid distance and duration to explore pace changes.';

  const difference = lastPace - firstPace;
  const change = Math.abs(difference);
  const headline = change < 1 ? 'Session-average pace is broadly stable.'
    : difference < 0 ? `Latest session average is ${formatSeconds(change)} /100m faster.`
    : `Latest session average is ${formatSeconds(change)} /100m slower.`;

  const recent = ordered.slice(-3);
  const recentDistances = recent.map(session => session.distance);
  const variability = Math.max(...recentDistances) - Math.min(...recentDistances);
  const context = variability < 200
    ? 'Recent session distances are similar, making volume easier to compare.'
    : 'Workout distances vary: compare matching repetitions rather than treating average pace as a fitness score.';

  return `
    <b>${headline}</b>
    <p>Comparing ${formatDate(first.date, { month: 'short', day: 'numeric' })} with
      ${formatDate(last.date, { month: 'short', day: 'numeric' })}.
      You have ${sessions.length} sessions and ${formatNumber(summary(sessions).distance / 1000, 2)} km in this view.</p>
    <p>${context}</p>
    <p class="muted">Intensity, stroke and equipment are not normalized. This is an observation, not a diagnosis.</p>`;
}

/** Main dashboard, built from reusable view fragments. */
function bestEffortsPanel(sessions) {
  const units = [...new Set(sessions.filter(session => session.sport === 'pool')
    .map(session => session.poolUnit || 'm'))];
  const groups = units.length ? units : ['m'];
  // "NEW" marks a best set in the most recent session of this view.
  const latestId = [...sessions].sort((a, b) => b.date.localeCompare(a.date))[0]?.id;
  const tiles = groups.map(unit => {
    const efforts = distanceBests(sessions, [25, 50, 100, 200, 400, 800], unit);
    const unitHtml = escapeHtml(unit);
    return `<div class="effort-group">
      ${groups.length > 1 ? `<h3>${unit === 'yd' ? 'Yard pool' : 'Meter pool'}</h3>` : ''}
      <div class="bests">${efforts.map(effort => {
        const isNew = effort.session && effort.session.id === latestId;
        return `
        <div class="besttile${isNew ? ' new' : ''}">
          <span>${effort.distance} ${unitHtml}${isNew ? ' · NEW' : ''}</span>
          <strong>${formatSeconds(effort.time)}</strong>
          <small>${effort.session
            ? `<span class="best-pace">${formatSeconds(effort.time * 100 / effort.distance)}/100${unitHtml}</span> · ${formatDate(effort.session.date, { month: 'short', day: 'numeric' })}`
            : 'No continuous segment recorded'}</small>
        </div>`;
      }).join('')}</div></div>`;
  }).join('');
  return `<section class="panel">
    <div class="panelhead">
      <div><h2>Best recorded efforts</h2><p>Continuous pool segments · suspect lengths excluded · yards/meters separate</p></div>
      <button class="subtle" data-page="performance">Detailed curve →</button>
    </div>${tiles}

}

/** Inspect one session, with optional browser-local annotations. */
const percent = ratio => `${Math.round(ratio * 100)}%`;

function sessionPage() {
  const session = selectedSession();
  if (!session) {
    return `<div class="pagehead"><h1>Session analysis</h1></div>
      ${emptyState('No swim selected', 'Import a FIT file to see an analysis.')}`;
  }

  const draft = state.drafts.get(session.id);
  const noteText = draft?.notes ?? session.notes ?? '';
  const equipmentText = draft?.equipment ?? (session.equipment || []).join(', ');
  const lengths = session.lengths || [];
  const quality = assessLengths(session);
  const excluded = quality.map((flag, index) => flag.excluded ? index : -1).filter(index => index >= 0);
  // Chart labels use the record number from the length table, not a new count.
  const shown = lengths.map((length, index) => ({ length, index, record: recordNumber(index) }))
    .filter(({ length }, index) => active(length) && !quality[index].excluded);
  const totals = paceTotals(session);
  const paceByLength = shown.map(({ length, record }) => ({
    label: record, value: length.duration * 100 / length.distance
  }));
  const strokesByLength = shown.filter(({ length }) => Number.isFinite(length.strokes))
    .map(({ length, record }) => ({ label: record, value: length.strokes }));
  const drift = lengthDrift(session);
  const correctedPace = totals.excluded > 0;
  const swimType = session.sport === 'pool' ? `Pool ${formatNumber(session.poolUnit === 'yd' ? session.poolMeters / 0.9144 : session.poolMeters, 2)}${escapeHtml(session.poolUnit || 'm')}` : 'Open water';
  const hasRestExcluded = session.sport === 'pool' && session.durationBasis !== 'timer';
  const movingTimeDescription = hasRestExcluded
    ? session.restDuration > 0
      ? `Excludes ${formatDuration(session.restDuration)} recorded rest`
      : 'Active lengths only'
    : 'FIT timer time (rest may be included)';
  // Current all-time bests across all loaded sessions, not only the selected period.
  const unit = session.poolUnit || 'm';
  const personalBests = session.sport === 'pool'
    ? distanceBests(sortedSessions(), [25, 50, 100, 200, 400, 800, 1500], unit)
      .filter(effort => effort.session?.id === session.id)
    : [];
  const unitHtml = escapeHtml(unit);
  // Shade the longest PB segment on the pace chart. Its lengths are all shown,
  // because a best effort cannot contain a rest or an excluded length.
  const longestBest = personalBests[personalBests.length - 1];
  const bandPoints = longestBest
    ? shown.map(({ index }, point) => index >= longestBest.start && index <= longestBest.end ? point : -1)
      .filter(point => point >= 0)
    : [];
  const band = bandPoints.length
    ? { from: bandPoints[0], to: bandPoints[bandPoints.length - 1], label: `PB ${longestBest.distance} ${unit}` }
    : null;
  const baseline = qualityBaseline(session);

  return `
    <div class="pagehead">
      <div>
        <div class="breadcrumb">LAB / 02 / SESSION / ${formatDate(session.date)}</div>
        <h1>${escapeHtml(session.title)}</h1>
        <p>${formatDate(session.date)} · ${swimType} · ${escapeHtml(session.source)} data</p>
        ${personalBests.length ? tag(`◆ Personal best × ${personalBests.length}`, 'pb') : ''}
      </div>
      <div class="pageactions">
        <button class="danger-lite" data-delete="${escapeHtml(session.id)}">Remove session</button>
        <button class="subtle" data-page="sessions">All sessions</button>
      </div>
    </div>

    <div class="metrics four">
      ${metric('Distance', `${formatNumber(session.distance)} <small>m</small>`, session.sport === 'pool' ? `${lengths.filter(active).length} lengths · as recorded` : 'Recorded or reconstructed')}
      ${metric(hasRestExcluded ? 'Swim time' : 'Timer time', formatDuration(session.duration), movingTimeDescription)}
      ${metric(correctedPace ? 'Pace · filtered' : 'Pace · average', `${formatSeconds(pace(session))} <small>/100m</small>`, correctedPace ? `▲ ${totals.excluded} suspect ${totals.excluded === 1 ? 'length' : 'lengths'} omitted` : 'Moving pace', correctedPace ? 'warn' : '')}
      ${metric('Δ Stroke drift', drift === null ? '—' : `${drift >= 0 ? '+' : ''}${drift.toFixed(1)} <small>%</small>`, 'Stroke count: last ¼ vs first ¼')}
    </div>

    ${hasRestExcluded && session.restDuration > 0 && Number.isFinite(session.timerDuration) &&
      Math.abs(session.duration + session.restDuration - session.timerDuration) < 1 ? `
      <p class="fineprint">Swimming ${formatDuration(session.duration)} + recorded rest ${formatDuration(session.restDuration)} = FIT timer ${formatDuration(session.timerDuration)}.</p>
    ` : ''}

    ${session.sport === 'pool' && lengths.some(active) ? `
      <section class="panel" aria-label="Intervals">
        <div class="panelhead"><div><h2>Intervals</h2><p>Lengths between rest markers · as recorded · sets group consecutive equal distances</p></div><span class="fig">${intervals(session).length} INTERVALS</span></div>
        ${intervalTable(session)}
      </section>
    ` : ''}

    ${personalBests.length ? `
      <section class="panel pb-panel" aria-label="Personal bests">
        <b class="panel-label">◆ Personal best · ${personalBests.length} ${personalBests.length === 1 ? 'distance' : 'distances'}</b>
        <p>Fastest continuous segment among all loaded sessions. Suspect lengths are excluded.</p>
        <div class="tablewrap"><table>
          <thead><tr><th>Dist</th><th>Time</th><th>Pace /100${unitHtml}</th><th>Records</th></tr></thead>
          <tbody>${personalBests.map(effort => `
            <tr><td class="pb-dist">${effort.distance} ${unitHtml}</td><td>${formatSeconds(effort.time)}</td>
              <td>${formatSeconds(effort.time * 100 / effort.distance)}</td>
              <td>${effort.start === effort.end ? `REC ${recordNumber(effort.start)}` : `REC ${recordNumber(effort.start)}–${recordNumber(effort.end)}`}</td></tr>`).join('')}
          </tbody>
        </table></div>
      </section>
    ` : ''}

    ${excluded.length ? `
      <section class="panel quality-panel" aria-label="Swimming length data quality">
        <b class="panel-label">▲ Data quality · ${excluded.length} ${excluded.length === 1 ? 'length' : 'lengths'} excluded</b>
        <p>Excluded from pace analytics and best efforts. Original FIT distance, swimming time, and rest records are unchanged. You can override each decision.</p>
        <p class="rule">Rule: pace &lt; ${percent(FAST_TIME_RATIO)} of median AND strokes &lt; ${percent(LOW_STROKE_RATIO)} of median.
          ${baseline ? `Session median: ${formatSeconds(baseline.timePerMeter * session.poolMeters)} · ${formatNumber(baseline.strokes, 1)} strokes per length.` : 'Not enough lengths with strokes for a median; only manual decisions apply.'}</p>
        <div class="tablewrap"><table>
          <thead><tr><th>Rec</th><th>Duration</th><th>Strokes</th><th>Decision</th><th></th></tr></thead>
          <tbody>${excluded.map(index => `
            <tr><td class="warn">▲ ${recordNumber(index)}</td>
              <td>${formatSeconds(lengths[index].duration)}${baseline ? ` <span class="muted">/ ${formatSeconds(baseline.timePerMeter * lengths[index].distance)}</span>` : ''}</td>
              <td>${formatNumber(lengths[index].strokes)}${baseline ? ` <span class="muted">/ ${formatNumber(baseline.strokes, 1)}</span>` : ''}</td>
              <td>${quality[index].manual === 'exclude' ? 'Manual' : 'Automatic'}</td>
              <td><button class="quality-jump" data-jump-length="${index}">Review REC ${recordNumber(index)}</button></td></tr>`).join('')}
          </tbody>
        </table></div>
      </section>
    ` : ''}

    ${session.sport === 'open-water' ? `
      <section class="panel info"><b>Open-water session</b>
        <p>Distance and time are supported. Length-by-length charts apply only to pool swimming.</p>
      </section>` : ''}

    <div class="twocol">
      <section class="panel">
        <div class="panelhead"><div><h2>Pace by length</h2><p>Seconds per 100 m · excluded lengths omitted · x: REC</p></div><span class="fig">FIG.1 · S /100M</span></div>
        ${lineChart(paceByLength, { unit: 'pace', label: 'Pace per length', band })}
      </section>
      <section class="panel">
        <div class="panelhead"><div><h2>Strokes per length</h2><p>As counted by the watch · excluded lengths omitted · x: REC</p></div><span class="fig">FIG.2 · COUNT</span></div>
        ${lineChart(strokesByLength, { label: 'Strokes per length' })}
      </section>
    </div>

    <div class="twocol unequal">
      <section class="panel">
        <div class="panelhead"><div><h2>Recorded lengths</h2><p>Rest markers appear as separate entries</p></div><span class="fig">${lengths.length} RECORDS · ${lengths.filter(length => length.isRest).length} REST</span></div>
        ${lengthTable(session)}
      </section>
      <section class="panel">
        <div class="panelhead"><div><h2>Session notes</h2><p>Add details your watch could not record</p></div></div>
        <label class="fieldlabel" for="notes">Workout structure, technique, effort</label>
        <textarea id="notes" rows="6" placeholder="e.g., 5 × 200 with 10 s rest">${escapeHtml(noteText)}</textarea>
        <label class="fieldlabel" for="equipment">Equipment used (comma-separated)</label>
        <input id="equipment" type="text" value="${escapeHtml(equipmentText)}" placeholder="Paddles, Pull buoy..."/>
        <button class="primary save" data-save="${escapeHtml(session.id)}">Save annotations</button>
        <p class="fineprint">Annotations stay in this browser and are included in JSON backup.</p>
      </section>
    </div>`;
}

/** Secondary views: performance, trends, and local-data settings. */
function effortGroup(sessions, unit, figure) {
  const targets = [25, 50, 100, 200, 400, 800, 1500];
  const efforts = distanceBests(sessions, targets, unit);
  const curve = efforts.filter(effort => effort.time !== null).map(effort => ({
    label: `${effort.distance}${unit}`,
    value: effort.time * 100 / effort.distance
  }));
  const unitHtml = escapeHtml(unit);
  const rows = efforts.map(effort => `
    <tr>
      <td>${effort.distance} ${unitHtml}</td>
      <td class="strong">${formatSeconds(effort.time)}</td>
      <td>${effort.time !== null ? formatSeconds(effort.time * 100 / effort.distance) : '—'}</td>
      <td>${effort.session ? formatDate(effort.session.date) : '—'}</td>
    </tr>`).join('');
  return `
    <section class="panel">
      <div class="panelhead"><div><h2>Best pace — ${unit === 'yd' ? 'yards' : 'meters'}</h2>
        <p>Seconds / 100${unitHtml} · lower is faster</p></div><span class="fig">FIG.${figure} · S /100${unitHtml.toUpperCase()}</span></div>
      ${lineChart(curve, { unit: 'pace', label: `Best pace per 100${unit}` })}
      <div class="tablewrap"><table>
        <thead><tr><th>Distance</th><th>Best time</th><th>Pace /100${unitHtml}</th><th>Session</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>`;
}

function performancePage(sessions) {
  const units = [...new Set(sessions.filter(s => s.sport === 'pool')
    .map(s => s.poolUnit || 'm'))];
  const shownUnits = units.length ? units : ['m'];
  return `
    <div class="pagehead"><div><div class="eyebrow">LAB / 04 / PERFORMANCE</div><h1>Performance curve</h1>
      <p>Best continuous training efforts; suspect lengths excluded; meters and yards kept separate.</p>
    </div></div>
    ${shownUnits.map((unit, index) => effortGroup(sessions, unit, index + 1)).join('')}
    <p class="fineprint">Different strokes, drills or equipment may not be comparable. Yard pace is /100yd.</p>`;
}

function trendsPage(sessions) {
  const ordered = [...sessions].reverse();
  const distanceTrend = ordered.map(session => ({
    label: formatDate(session.date, { month: 'short', day: 'numeric' }),
    value: session.distance / 1000
  }));
  const strokeTrend = ordered.map(session => ({
    label: formatDate(session.date, { month: 'short', day: 'numeric' }),
    value: summary([session]).stroke
  })).filter(point => Number.isFinite(point.value));

  return `
    <div class="pagehead"><div><div class="eyebrow">LAB / 03 / TRENDS</div><h1>Training trends</h1><p>Track changes across sessions, with context.</p></div></div>
    ${metricCards(sessions)}
    <div class="twocol">
      <section class="panel">
        <div class="panelhead"><div><h2>Session distance</h2><p>Distance in km</p></div><span class="fig">FIG.1 · KM</span></div>
        ${lineChart(distanceTrend, { unit: 'km', fill: true })}
      </section>
      <section class="panel">
        <div class="panelhead"><div><h2>Stroke-count trend</h2><p>Unadjusted mean across recorded active lengths</p></div><span class="fig">FIG.2 · STROKES / LENGTH</span></div>
        ${lineChart(strokeTrend, { label: 'Mean strokes per pool length' })}
      </section>
    </div>
    <div class="panel info"><b>Interpretation caution</b>
      <p>Stroke counts can change with pace, stroke mix, pool length, drills, equipment or measurement error. Future matched-set analysis will reduce these confounders.</p>
    </div>`;
}

function settingsPage() {
  return `
    <div class="pagehead"><div><div class="eyebrow">LAB / 05 / DATA</div><h1>Data & settings</h1><p>Local FIT analysis without cloud synchronization.</p></div></div>
    <div class="twocol">
      <section class="panel">
